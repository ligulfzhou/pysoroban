name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install compiler
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build and structurally validate every example
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/pysoroban-wasm"
          mkdir -p "$artifact_dir"
          for source in examples/*_contract.py; do
            artifact="$artifact_dir/$(basename "${source%.py}").wasm"
            pysoroban build "$source" --output "$artifact"
            pysoroban validate "$artifact"
            pysoroban verify "$source" --wasm "$artifact"
          done

      - name: Validate WebAssembly semantics with Node
        shell: bash
        run: |
          node - "$RUNNER_TEMP/pysoroban-wasm" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const directory = process.argv[2];
          for (const name of fs.readdirSync(directory).filter((item) => item.endsWith(".wasm"))) {
            const artifact = fs.readFileSync(path.join(directory, name));
            if (!WebAssembly.validate(artifact)) {
              throw new Error(`${name} is not valid WebAssembly`);
            }
          }
          NODE

      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheel"

  web:
    name: Cloudflare demo / Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
