name: Testnet

# Optional. This workflow is not part of the required CI checks. Run it by
# hand when a friendbot-funded throwaway key should deploy the examples.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet:
    name: Deploy examples on Stellar testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Stellar CLI 25.2.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/stellar-cli.tar.gz -L \
            https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version

      - name: Install compiler
        run: python -m pip install .

      - name: Deploy and invoke
        run: python scripts/testnet_e2e.py --fund

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: testnet-deployments
          path: |
            deployments/testnet.json
            web/app/testnet-manifest.ts
